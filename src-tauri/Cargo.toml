[package]
name = "seshat-notch-desktop"
version = "1.0.0"
description = "Seshat Notch Windows Desktop Shell — System Tray, Global Quick-Add Shortcut, Offline Notifications & Automatic Disk Backups"
authors = ["Swashbuckler16"]
license = "MIT"
repository = "https://github.com/Swashbuckler16/Seshat-Notch.git"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-fs = "2.0.0"
