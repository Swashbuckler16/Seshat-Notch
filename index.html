<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Seshat Notch — Personal multi-horizon planning and tracking application. Every day, a notch. Every goal, measured." />
    <title>Seshat Notch — Planner and Tracker</title>
    <!-- Prevent theme flash before first paint (Hallmark standard) -->
    <script>
      (function() {
        const saved = localStorage.getItem('seshat-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.mode = 'dark';
        } else {
          document.documentElement.dataset.mode = 'light';
        }
      })();
    </script>
    <!-- Open-license typefaces: Inter for text & tabular numerals, JetBrains Mono for measurements/ledger ticks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
